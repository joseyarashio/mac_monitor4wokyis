<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>WokyMon mockup</title>
<meta name="viewport" content="width=1280">
<style>
  :root {
    --bg: #0B0F14; --panel: #121821; --line: #1E2733;
    --fg: #E6EDF3; --dim: #8B98A5;
    --ok: #3FB950; --warn: #D29922; --bad: #F85149; --accent: #58A6FF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg);
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-variant-numeric: tabular-nums; }
  body { width: 1280px; height: 720px; overflow: hidden; display: grid;
    grid-template-rows: 120px 380px 220px; }
  .top { display: flex; align-items: center; padding: 0 32px; gap: 40px;
    border-bottom: 2px solid var(--line); }
  .clock { font-size: 96px; font-weight: 700; letter-spacing: 2px; line-height: 1; }
  .date { font-size: 28px; color: var(--dim); line-height: 1.3; }
  .sys { margin-left: auto; text-align: right; font-size: 24px; color: var(--dim); line-height: 1.4; }
  .sys b { color: var(--fg); font-weight: 600; }
  .mid { display: grid; grid-template-columns: repeat(4, 1fr); }
  .bot { display: grid; grid-template-columns: 1fr 1fr; }
  .tile { padding: 18px 24px; border-right: 2px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
  .tile:last-child { border-right: 0; }
  .bot .tile { border-top: 2px solid var(--line); }
  .label { font-size: 24px; color: var(--dim); font-weight: 600; letter-spacing: 1px; }
  .big { font-size: 72px; font-weight: 700; line-height: 1; }
  .big small { font-size: 32px; color: var(--dim); font-weight: 500; }
  .sub { font-size: 24px; color: var(--dim); line-height: 1.4; }
  .sub b { color: var(--fg); font-weight: 600; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  svg.spark { width: 100%; height: 70px; }
  .cores { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; height: 70px; align-items: end; }
  .cores div { background: var(--ok); border-radius: 2px; }
  .cores div.e { opacity: .75; }
  .ring { display: flex; align-items: center; gap: 20px; }
  .ring svg { width: 120px; height: 120px; }
  .net { display: grid; grid-template-columns: 220px 1fr; row-gap: 8px; align-items: center; }
  .net .v { font-size: 40px; font-weight: 700; line-height: 1; }
  .net .v small { font-size: 22px; color: var(--dim); }
  .net svg { height: 60px; width: 100%; }
</style>
</head>
<body>
  <header class="top">
    <div class="clock" id="clock">14:32:07</div>
    <div class="date">2026-09-18<br>星期五</div>
    <div class="sys"><b>mac-mini</b> · up 4h 22m<br>load <b>2.14</b> 1.83 1.52</div>
  </header>

  <section class="mid">
    <div class="tile">
      <div class="label">CPU</div>
      <div class="big ok">37<small>%</small></div>
      <svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none">
        <polyline fill="none" stroke="#3FB950" stroke-width="1.2"
          points="0,22 8,20 16,24 24,15 32,18 40,10 48,14 56,20 64,12 72,16 80,9 88,13 100,11"/>
      </svg>
      <div class="cores">
        <div class="e" style="height:60%"></div><div class="e" style="height:45%"></div>
        <div class="e" style="height:70%"></div><div class="e" style="height:30%"></div>
        <div class="e" style="height:55%"></div><div class="e" style="height:40%"></div>
        <div style="height:25%"></div><div style="height:35%"></div>
        <div style="height:90%;background:var(--bad)"></div><div style="height:20%"></div>
      </div>
      <div class="sub">6E · 4P</div>
    </div>

    <div class="tile">
      <div class="label">GPU</div>
      <div class="big ok">13<small>%</small></div>
      <svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none">
        <polyline fill="none" stroke="#3FB950" stroke-width="1.2"
          points="0,26 10,25 20,27 30,22 40,24 50,26 60,18 70,25 80,26 90,24 100,25"/>
      </svg>
      <div class="sub">render <b>12%</b> · tiler <b>13%</b><br>vram <b>0.9 GB</b></div>
    </div>

    <div class="tile">
      <div class="label">MEM</div>
      <div class="ring">
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="16" fill="none" stroke="#1E2733" stroke-width="6"/>
          <circle cx="20" cy="20" r="16" fill="none" stroke="#D29922" stroke-width="6"
            stroke-dasharray="70 100" stroke-linecap="butt" transform="rotate(-90 20 20)"/>
        </svg>
        <div class="big warn" style="font-size:56px">70<small>%</small></div>
      </div>
      <div class="sub"><b>11.2</b> / 16 GB<br>swap <b class="bad">7.4</b> / 8 GB</div>
    </div>

    <div class="tile">
      <div class="label">DISK</div>
      <div class="big ok" style="font-size:56px">412<small> / 460 GB</small></div>
      <div class="sub">R <b>12.4 MB/s</b><br>W <b>3.1 MB/s</b></div>
      <svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none">
        <polyline fill="none" stroke="#58A6FF" stroke-width="1.2"
          points="0,28 10,26 20,29 30,20 40,27 50,28 60,10 70,26 80,28 90,27 100,25"/>
      </svg>
    </div>
  </section>

  <section class="bot">
    <div class="tile net">
      <div class="label" style="grid-column:1/-1">NET · en0</div>
      <div class="v">↓ 12.4<small> Mb/s</small></div>
      <svg viewBox="0 0 100 30" preserveAspectRatio="none">
        <polyline fill="none" stroke="#58A6FF" stroke-width="1.2"
          points="0,25 10,22 20,26 30,15 40,20 50,8 60,18 70,24 80,12 90,16 100,10"/>
      </svg>
      <div class="v">↑ 1.2<small> Mb/s</small></div>
      <svg viewBox="0 0 100 30" preserveAspectRatio="none">
        <polyline fill="none" stroke="#3FB950" stroke-width="1.2"
          points="0,28 10,27 20,28 30,25 40,27 50,26 60,28 70,24 80,27 90,26 100,27"/>
      </svg>
    </div>
    <div class="tile">
      <div class="label">TEMP / FAN <span style="font-weight:400">(v2)</span></div>
      <div class="sub" style="font-size:32px;line-height:1.5">
        CPU <b>—</b> °C &nbsp; GPU <b>—</b> °C<br>
        fan <b>—</b> rpm
      </div>
    </div>
  </section>

<script>
  // 只有時鐘是活的,其餘為假資料。
  const pad = n => String(n).padStart(2, '0');
  setInterval(() => {
    const d = new Date();
    document.getElementById('clock').textContent =
      `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }, 250);
</script>
</body>
</html>
